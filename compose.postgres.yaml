services:
  postgres:
    image: postgres:17.10-alpine3.24@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: osfo_lifecycle
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:${OSFO_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d osfo_lifecycle"]
      interval: 1s
      timeout: 5s
      retries: 30
    volumes:
      - osfo-postgres-data:/var/lib/postgresql/data

volumes:
  osfo-postgres-data:

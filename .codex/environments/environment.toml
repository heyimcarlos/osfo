# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "osfo"

[setup]
script = '''
git_common_dir="$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null || true)"
source_root="$(dirname "$git_common_dir")"
reference_source="$source_root/.reference"

if [ -n "$git_common_dir" ] && [ -d "$reference_source" ]; then
  if [ -L .reference ]; then
    if [ "$(readlink .reference)" != "$reference_source" ]; then
      ln -sfn "$reference_source" .reference
    fi
  elif [ ! -e .reference ]; then
    ln -s "$reference_source" .reference
  else
    echo ".reference already exists; leaving it in place" >&2
  fi
fi

if [ -n "$git_common_dir" ] && [ -d "$source_root" ]; then
  find "$source_root" \
    \( \
      -name ".git" \
      -o -name ".reference" \
      -o -name ".worktrees" \
      -o -name "node_modules" \
      -o -name ".turbo" \
      -o -name ".wrangler" \
      -o -name ".dev-db" \
      -o -name "dist" \
      -o -name "build" \
      -o -name ".output" \
    \) -prune \
    -o -type f \
    \( -name ".env" -o -name ".env.*" -o -name ".dev.vars" \) \
    ! -name "*.example" \
    ! -name "*.sample" \
    ! -name "*.template" \
    ! -name ".envrc" \
    ! -name ".envrc.*" \
    -print |
  while IFS= read -r source_file; do
    relative_path="${source_file#"$source_root"/}"
    target_file="./$relative_path"
    target_dir="$(dirname "$target_file")"

    if [ -e "$target_file" ]; then
      continue
    fi

    mkdir -p "$target_dir"
    cp -p "$source_file" "$target_file"
  done
fi

if [ -n "$git_common_dir" ] && [ -d "$git_common_dir/info" ]; then
  touch "$git_common_dir/info/exclude"
  if ! grep -qxF ".reference" "$git_common_dir/info/exclude"; then
    printf "\n.reference\n" >> "$git_common_dir/info/exclude"
  fi
fi
'''

[[actions]]
name = "Install"
icon = "run"
command = "bun install --frozen-lockfile"

[[actions]]
name = "Run Local Server"
icon = "tool"
command = "bun run dev"

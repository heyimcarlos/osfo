name: osfo-action-mailpit

services:
  mailpit:
    image: axllent/mailpit:v1.30.6@sha256:7f33095f80e901f6ad08028f06ca284aa58fe84942be5496008d041d3b9f4d4d
    environment:
      MP_MAX_MESSAGES: "100"
      MP_SMTP_AUTH_ACCEPT_ANY: "0"
      MP_SMTP_AUTH_ALLOW_INSECURE: "0"
    ports:
      - "127.0.0.1:${OSFO_ACTION_MAILPIT_SMTP_PORT:-11025}:1025"
      - "127.0.0.1:${OSFO_ACTION_MAILPIT_HTTP_PORT:-18025}:8025"

name: Production alert delivery verification
run-name: Intentional alert delivery test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delivery-test:
    name: Intentional failure to verify alert delivery
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Emit the expected test failure
        run: |
          echo "This is an intentional notification-delivery test."
          echo "No application health failure is implied by this test result."
          exit 1

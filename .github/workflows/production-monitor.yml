name: Production HTTPS availability (runtime metrics unavailable)

on:
  workflow_dispatch:
  # Enable only after the notification recipient and permissions are reviewed.
  # schedule:
  #   - cron: "2-57/5 * * * *"

permissions:
  contents: read

concurrency:
  group: production-availability
  cancel-in-progress: false

jobs:
  availability:
    name: HTTPS availability only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify probe failure fixtures
        run: bunx vitest run infra/cloudflare/production-monitor.test.ts

      - name: Probe public HTTPS surfaces
        run: bun infra/cloudflare/production-monitor.ts

      - name: State coverage limits
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Only API runtime identity and web HTML availability are checked.

          **Runtime error metrics: MISSING.** No authorized CI analytics credential is configured.
          Database, provider health, user journeys, and deployment-version qualification are not covered.
          A green job means HTTPS availability passed, not complete production health.

          Scheduling and delivery verification remain separate activation steps.
          GitHub schedules may be delayed or dropped, and public-repository schedules disable after
          60 days without repository activity. Failed-run email follows the schedule's notification owner.
          SUMMARY

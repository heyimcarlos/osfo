name: Production availability and runtime errors

on:
  workflow_dispatch:
  schedule:
    - cron: "2-57/5 * * * *"

permissions:
  contents: read

concurrency:
  group: production-availability
  cancel-in-progress: false

jobs:
  availability:
    name: Availability and runtime errors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify probe failure fixtures
        if: github.event_name == 'workflow_dispatch'
        run: bunx vitest run infra/cloudflare/production-monitor.test.ts infra/cloudflare/production-runtime-metrics.test.ts

      - name: Probe production availability and runtime errors
        env:
          CLOUDFLARE_ANALYTICS_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ANALYTICS_ACCOUNT_ID }}
          CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_API_TOKEN }}
        run: bun infra/cloudflare/production-monitor.ts

      - name: State coverage limits
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          API runtime identity, web HTML and delayed sampled Worker runtime-error metrics are checked.

          Runtime metrics use a 15-minute window ending 5 minutes before observation; any observed error fails.
          Missing credentials, unavailable analytics or no invocation data are not a pass.
          Web runtime errors are NOT_APPLICABLE: the verified production Web deployment is assets-only.
          Requalify this exemption whenever its deployment gains Worker code.
          Database, provider health, user journeys, and deployment-version qualification are not covered.
          A green job is not complete production health or a five-minute detection guarantee.

          Alert delivery verification remains a separate qualification step.
          GitHub schedules may be delayed or dropped, and public-repository schedules disable after
          60 days without repository activity. Failed-run email follows the schedule's notification owner.
          SUMMARY

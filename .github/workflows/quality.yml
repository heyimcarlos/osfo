name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/quality-setup
      - run: bun run format:check

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/quality-setup
      - run: bun run ci:declarations
      - run: bun run lint

  typecheck:
    name: Effect diagnostics and typecheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/quality-setup
      - run: bun run ci:declarations
      - run: bun run typecheck

  runtime-tests:
    name: Effect Vitest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/quality-setup
      - run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: bun run test
        env:
          TERRAFORM_BIN: ${{ github.workspace }}/infra/scripts/terraform-ci.sh

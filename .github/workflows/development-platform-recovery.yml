name: Development platform recovery
run-name: ${{ github.event_name == 'workflow_run' && format('Recovery for Terraform run {0}', github.event.workflow_run.id) || format('Scheduled development reconciliation {0}', github.run_id) }}

on:
  workflow_run:
    workflows: [Terraform]
    types: [completed]
  schedule:
    - cron: "43 9 * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: terraform-development-platform
  queue: max

jobs:
  authorize:
    runs-on: ubuntu-24.04
    outputs:
      recover: ${{ steps.check.outputs.recover }}
      source_ref: ${{ steps.check.outputs.source_ref }}
      lifecycle_run_id: ${{ steps.check.outputs.lifecycle_run_id }}
    steps:
      - name: Select completed protected lifecycle runs
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_EVENT: ${{ github.event.workflow_run.event }}
          TRIGGER_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          RECOVERY_EVENT: ${{ github.event_name }}
          RECOVERY_RUN_ATTEMPT: ${{ github.run_attempt }}
          RECOVERY_RUN_ID: ${{ github.run_id }}
          RECOVERY_SOURCE_SHA: ${{ github.sha }}
        run: |
          printf 'recover=false\n' >>"$GITHUB_OUTPUT"
          if [[ "$RECOVERY_EVENT" == schedule ]]; then
            terraform_runs=$(gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/workflows/terraform.yml/runs?status=completed&per_page=100")
            successful_recoveries=$(gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/actions/workflows/development-platform-recovery.yml/runs?status=success&per_page=100")
            candidate_id=""
            candidate_attempt=""
            while IFS=$'\t' read -r run_id run_attempt; do
              [[ -n "$run_id" ]] || continue
              recovery_title="Recovery for Terraform run $run_id"
              if jq -e --arg title "$recovery_title" \
                '[.[].workflow_runs[]] | any(.display_title == $title)' \
                <<<"$successful_recoveries" >/dev/null; then
                continue
              fi
              run_jobs=$(gh api --paginate --slurp \
                "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=all")
              if jq -e '
                [.[].jobs[]] as $jobs
                | any($jobs[]; .name == "static" and .conclusion == "success")
                and any($jobs[];
                  .name == "development-authorization" and .conclusion == "success")
                and any($jobs[];
                  .name == "development-configuration" and .conclusion == "success")
                and any($jobs[];
                  .name == "development-lifecycle"
                  and (.conclusion == "failure" or .conclusion == "cancelled"
                    or .conclusion == "timed_out" or .conclusion == "stale"))
                and (any($jobs[];
                  .name == "development-cleanup" and .conclusion == "success") | not)
              ' <<<"$run_jobs" >/dev/null; then
                candidate_id=$run_id
                candidate_attempt=$run_attempt
                break
              fi
            done < <(jq -r '
              [.[].workflow_runs[]
                | select(.event == "workflow_dispatch" and .head_branch == "main")]
              | sort_by(.created_at) | reverse[]
              | [.id, .run_attempt] | @tsv
            ' <<<"$terraform_runs")
            if [[ -z "$candidate_id" ]]; then
              printf 'PASS: scheduled janitor found no abandoned protected lifecycle marker\n'
              exit 0
            fi

            source_static=false
            while IFS= read -r source_run_id; do
              [[ -n "$source_run_id" ]] || continue
              source_jobs=$(gh api --paginate --slurp \
                "repos/$GITHUB_REPOSITORY/actions/runs/$source_run_id/jobs?filter=all")
              if jq -e '[.[].jobs[]] | any(.name == "static" and .conclusion == "success")' \
                <<<"$source_jobs" >/dev/null; then
                source_static=true
                break
              fi
            done < <(jq -r --arg source_sha "$RECOVERY_SOURCE_SHA" '
              [.[].workflow_runs[] | select(.head_sha == $source_sha)] | .[].id
            ' <<<"$terraform_runs")
            if [[ "$source_static" != true ]]; then
              printf 'FAIL: scheduled janitor source lacks exact successful static proof\n' >&2
              exit 1
            fi

            printf 'recover=true\n' >>"$GITHUB_OUTPUT"
            printf 'source_ref=%s\n' "$RECOVERY_SOURCE_SHA" >>"$GITHUB_OUTPUT"
            printf 'lifecycle_run_id=janitor-%s-%s-%s-%s\n' \
              "$candidate_id" "$candidate_attempt" \
              "$RECOVERY_RUN_ID" "$RECOVERY_RUN_ATTEMPT" >>"$GITHUB_OUTPUT"
            printf 'PASS: scheduled janitor selected abandoned lifecycle %s attempt %s at reviewed source %s\n' \
              "$candidate_id" "$candidate_attempt" "$RECOVERY_SOURCE_SHA"
            exit 0
          fi
          if [[ "$TRIGGER_EVENT" != workflow_dispatch || "$TRIGGER_HEAD_BRANCH" != main ]]; then
            printf 'PASS: completed workflow could not have run the protected lifecycle\n'
            exit 0
          fi
          jobs=$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$TRIGGER_RUN_ID/jobs?filter=all")
          if jq -e '
            [.[].jobs[]] as $jobs
            | any($jobs[]; .name == "static" and .conclusion == "success")
            and any($jobs[];
              .name == "development-authorization" and .conclusion == "success")
            and any($jobs[];
              .name == "development-configuration" and .conclusion == "success")
          ' \
            <<<"$jobs" >/dev/null; then
            printf 'recover=true\n' >>"$GITHUB_OUTPUT"
            printf 'source_ref=%s\n' "$TRIGGER_HEAD_SHA" >>"$GITHUB_OUTPUT"
            printf 'lifecycle_run_id=%s-%s\n' \
              "$TRIGGER_RUN_ID" "$TRIGGER_RUN_ATTEMPT" >>"$GITHUB_OUTPUT"
          fi

  artifact-cleanup:
    needs: authorize
    if: needs.authorize.outputs.recover == 'true'
    runs-on: ubuntu-24.04
    environment: foundation
    permissions:
      contents: read
      id-token: write
    env:
      TF_VARSET_FILE: ${{ github.workspace }}/infra/roots/development/platform/development.tfvars.json
      FOUNDATION_SERVICE_ACCOUNT: ${{ vars.GCP_FOUNDATION_TERRAFORM_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.authorize.outputs.source_ref }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_FOUNDATION_TERRAFORM_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: 569.0.0
      - name: Remove immutable artifact objects through foundation recovery
        shell: bash
        run: infra/tests/development-platform-prepare-cleanup.sh

  platform-cleanup:
    needs: [authorize, artifact-cleanup]
    if: >-
      always() &&
      needs.authorize.outputs.recover == 'true' &&
      needs.artifact-cleanup.result == 'success'
    runs-on: ubuntu-24.04
    environment: development-platform
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      TF_VARSET_FILE: ${{ github.workspace }}/infra/roots/development/platform/development.tfvars.json
      TF_IMAGE_DIGESTS_FILE: ${{ github.workspace }}/infra/roots/development/platform/image-digests.json
      TERRAFORM_BIN: ${{ github.workspace }}/infra/scripts/terraform-ci.sh
      SAVED_PLAN_BUCKET: ${{ vars.GCP_SAVED_PLAN_BUCKET }}
      DEVELOPMENT_STATE_BUCKET: ${{ vars.GCP_DEVELOPMENT_STATE_BUCKET }}
      DEVELOPMENT_PLATFORM_CLEANUP_ONLY: "1"
      DEVELOPMENT_LIFECYCLE_RUN_ID: ${{ needs.authorize.outputs.lifecycle_run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.authorize.outputs.source_ref }}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEVELOPMENT_PLATFORM_TERRAFORM_SERVICE_ACCOUNT }}
      - name: Initialize isolated development state for recovery
        run: |
          infra/scripts/terraform-ci.sh -chdir=infra/roots/development/platform init -input=false \
            -backend-config="bucket=$DEVELOPMENT_STATE_BUCKET" \
            -backend-config="prefix=roots/development/platform"
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: 569.0.0
      - name: Apply bound destroy and prove provider absence
        shell: bash
        run: infra/tests/development-platform-live.sh

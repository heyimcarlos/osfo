global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: osfo-evidence-runner
    static_configs:
      - targets: [host.docker.internal:9464]

  - job_name: osfo-runner-node
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: osfo-postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: cloud-sql-auth-proxy
    static_configs:
      - targets: [host.docker.internal:9092]

  - job_name: temporal-rust-sdk-worker
    metrics_path: /metrics
    static_configs:
      - targets: [host.docker.internal:9465]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

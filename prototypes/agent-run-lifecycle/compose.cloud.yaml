services:
  osfo-postgres:
    ports: !override
      - "127.0.0.1:55433:5432"

  postgres-exporter:
    environment:
      DATA_SOURCE_NAME: ${OSFO_CLOUD_EXPORTER_DSN:?OSFO_CLOUD_EXPORTER_DSN is required}
    extra_hosts:
      - host.docker.internal:host-gateway

  stackdriver-exporter:
    image: prometheuscommunity/stackdriver-exporter:v0.19.0@sha256:c0a0cbf76570bb7b50455a44d32f3fc9e9012812e5510ec85f7c65170420a737
    command:
      - --google.project-ids=${GOOGLE_CLOUD_PROJECT:?GOOGLE_CLOUD_PROJECT is required}
      - --monitoring.metrics-prefixes=cloudsql.googleapis.com/database/cpu
      - --monitoring.metrics-prefixes=cloudsql.googleapis.com/database/memory
      - --monitoring.metrics-prefixes=cloudsql.googleapis.com/database/swap
      - --monitoring.metrics-prefixes=cloudsql.googleapis.com/database/disk
      - --monitoring.metrics-prefixes=cloudsql.googleapis.com/database/network
      - --monitoring.metrics-prefixes=cloudsql.googleapis.com/database/postgresql/num_backends
      - --monitoring.metrics-prefixes=cloudsql.googleapis.com/database/postgresql/transaction_count
      - --monitoring.metrics-prefixes=cloudsql.googleapis.com/database/postgresql/deadlock_count
      - --monitoring.metrics-prefixes=cloudsql.googleapis.com/database/postgresql/disk
      - --monitoring.metrics-prefixes=cloudsql.googleapis.com/database/postgresql/write_ahead_log
      - --monitoring.metrics-prefixes=cloudsql.googleapis.com/database/postgresql/vacuum
      - --monitoring.filters=cloudsql.googleapis.com/database:resource.labels.database_id="${GOOGLE_CLOUD_PROJECT}:${OSFO_CLOUD_SQL_INSTANCE:?OSFO_CLOUD_SQL_INSTANCE is required}"
      - --monitoring.metrics-interval=5m
      - --stackdriver.max-retries=2
      - --stackdriver.http-timeout=20s

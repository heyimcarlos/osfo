[package]
name = "osfo-agent-run-lifecycle-prototype"
version = "0.0.0"
edition = "2024"
publish = false

[features]
default = ["lifecycle-evidence"]
lifecycle-evidence = [
    "dep:rig-agent",
    "temporal-cloud",
]
temporal-cloud = [
    "dep:temporalio-client",
    "dep:temporalio-common",
    "dep:temporalio-macros",
    "dep:temporalio-sdk",
    "dep:temporalio-sdk-core",
    "dep:temporalio-workflow",
]
deployed-ingress = []

[dependencies]
anyhow = "=1.0.104"
dotenvy = "=0.15.7"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
schemars = "=1.2.2"
postgres = "=0.19.12"
rig-agent = { version = "=0.41.0", default-features = false, features = ["test-utils"], optional = true }
sha2 = "=0.10.9"
hdrhistogram = "=7.6.0"
futures-util = "=0.3.33"
futures = "=0.3.33"
temporalio-client = { version = "=0.5.0", default-features = false, features = ["tls-ring"], optional = true }
temporalio-common = { version = "=0.5.0", default-features = false, features = ["prometheus"], optional = true }
temporalio-macros = { version = "=0.5.0", optional = true }
temporalio-sdk = { version = "=0.5.0", default-features = false, optional = true }
temporalio-sdk-core = { version = "=0.5.0", default-features = false, optional = true }
temporalio-workflow = { version = "=0.5.0", optional = true }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "signal"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "query", "rustls", "stream"] }
axum = "=0.8.9"
deadpool-postgres = "=0.14.1"
tokio-postgres = "=0.7.18"
subtle = "=2.6.1"
tower = "=0.5.3"
http-body-util = "=0.1.4"

[[bin]]
name = "confirmation_evidence"
path = "src/bin/confirmation_evidence.rs"
required-features = ["lifecycle-evidence"]

[[bin]]
name = "failure_evidence"
path = "src/bin/failure_evidence.rs"
required-features = ["lifecycle-evidence"]

[[bin]]
name = "focused_evidence"
path = "src/bin/focused_evidence.rs"
required-features = ["lifecycle-evidence"]

[[bin]]
name = "provider_evidence"
path = "src/bin/provider_evidence.rs"
required-features = ["lifecycle-evidence"]

[[bin]]
name = "reasoning_discovery"
path = "src/bin/reasoning_discovery.rs"
required-features = ["lifecycle-evidence"]

[[bin]]
name = "temporal_cloud_worker"
path = "src/bin/temporal_cloud_worker.rs"
required-features = ["temporal-cloud"]

[[bin]]
name = "temporal_cloud_smoke_client"
path = "src/bin/temporal_cloud_smoke_client.rs"
required-features = ["temporal-cloud"]

[[bin]]
name = "temporal_cloud_load_client"
path = "src/bin/temporal_cloud_load_client.rs"
required-features = ["temporal-cloud"]

[[bin]]
name = "deployed_load"
path = "src/bin/deployed_load.rs"
required-features = ["deployed-ingress"]

[[bin]]
name = "deployed_dashboard"
path = "src/bin/deployed_dashboard.rs"
required-features = ["deployed-ingress"]

[[bin]]
name = "dispatch_schema_migrate"
path = "src/bin/dispatch_schema_migrate.rs"
required-features = ["deployed-ingress"]

[[bin]]
name = "dispatch_schema_initialize"
path = "src/bin/dispatch_schema_initialize.rs"
required-features = ["deployed-ingress"]

services:
  postgres:
    image: postgres:17.6-alpine
    container_name: osfo-dispatch-prototype-postgres
    cpus: 4.0
    mem_limit: 4g
    shm_size: 1g
    environment:
      POSTGRES_DB: osfo_dispatch_prototype
      POSTGRES_USER: prototype
      POSTGRES_HOST_AUTH_METHOD: trust
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - track_io_timing=on
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=200ms
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prototype -d osfo_dispatch_prototype"]
      interval: 1s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:55432:5432"
